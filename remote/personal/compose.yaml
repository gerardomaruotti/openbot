name: openbot-personal-remote

# Use only on the selected private Linux host. This project does not share containers or volumes
# with remote/compose.yaml. Secret values come from the protected generated remote.env file.
services:
  acme:
    image: goacme/lego:v5.3.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/openbot/renew.sh"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set the private certificate contact}
      SIGNAL_DOMAIN: ${SIGNAL_DOMAIN:?Set the private Signal domain}
      TURN_DOMAIN: ${TURN_DOMAIN:?Set the private TURN domain}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?Set a DNS token for maruotti.org only}
      ACME_CERTIFICATE_GROUP_ID: 2000
    volumes:
      - acme-data:/acme
      - ../acme/renew.sh:/opt/openbot/renew.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /acme/certificates/$${SIGNAL_DOMAIN}.crt && test -s /acme/certificates/$${SIGNAL_DOMAIN}.key"]
      interval: 10s
      timeout: 3s
      retries: 30

  remote-api:
    build:
      context: ../..
      dockerfile: remote/api/Dockerfile
      args:
        OPENBOT_SOURCE_COMMIT: ${OPENBOT_SOURCE_COMMIT:?Set the reviewed source commit}
    restart: unless-stopped
    depends_on:
      acme:
        condition: service_healthy
    environment:
      REMOTE_SIGNAL_HOST: 0.0.0.0
      REMOTE_SIGNAL_PORT: 8443
      REMOTE_HEALTH_HOST: 0.0.0.0
      REMOTE_HEALTH_PORT: 8080
      REMOTE_TLS_CERT_PATH: /acme/certificates/${SIGNAL_DOMAIN}.crt
      REMOTE_TLS_KEY_PATH: /acme/certificates/${SIGNAL_DOMAIN}.key
      REMOTE_TICKET_JWKS_URL: ${REMOTE_TICKET_JWKS_URL:?Set the private account JWKS URL}
      REMOTE_CONTROL_PLANE_URL: ${REMOTE_CONTROL_PLANE_URL:?Set the private account origin}
      REMOTE_SESSION_SECRET: ${REMOTE_SESSION_SECRET:?Set a private session secret}
      REMOTE_AUTH_WEBHOOK_SECRET: ${REMOTE_AUTH_WEBHOOK_SECRET:?Set the shared private webhook secret}
      REMOTE_METRICS_TOKEN: ${REMOTE_METRICS_TOKEN:?Set a private metrics token}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set the private coturn shared secret}
      TURN_HOST: ${TURN_DOMAIN}
      TURN_PORT: 3478
      TURN_TLS_PORT: 5349
      REMOTE_MAX_CONNECTIONS_PER_USER: 32
      REMOTE_MAX_CONNECTIONS_PER_IP: 32
      REMOTE_MAX_MESSAGES_PER_MINUTE: 600
      REMOTE_TRUST_PROXY: "false"
    ports:
      - "443:8443/tcp"
      - "127.0.0.1:9642:8080/tcp"
    group_add: ["2000"]
    volumes: ["acme-data:/acme:ro"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]

  coturn:
    build:
      context: ../..
      dockerfile: remote/coturn/Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      acme:
        condition: service_healthy
    environment:
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?Set the private Linux public IPv4 address}
      TURN_REALM: ${TURN_DOMAIN}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set the private coturn shared secret}
      TURN_TLS_CERT_PATH: /acme/certificates/${SIGNAL_DOMAIN}.crt
      TURN_TLS_KEY_PATH: /acme/certificates/${SIGNAL_DOMAIN}.key
    group_add: ["2000"]
    volumes: ["acme-data:/acme:ro"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 -p 3478 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  acme-data:
